name: Offline verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.29
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check conftest.py python python_tests tools
      - name: Check host-platform compatibility
        run: uv run python -m pytest -q python_tests/test_overload.py
      - run: uv run python -m pytest -q
      - run: uv run python tools/verify_public_results.py
      - run: docker build -f deploy/Dockerfile -t dilemma-dynamics-research:test .
      - run: docker run --rm --network none dilemma-dynamics-research:test --help
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run verify:public
      - run: npm test
      - run: npm run build
      - run: npm run build:public
