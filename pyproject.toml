[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gamefield-research"
version = "0.1.0"
description = "Auditable bounded-procedure evaluations in repeated games"
requires-python = ">=3.12,<3.13"
dependencies = [
  "inspect-ai>=0.3",
  "httpx>=0.28",
  "numpy>=2",
  "pyarrow>=19",
  "matplotlib>=3.10",
]

[project.optional-dependencies]
mlflow = ["mlflow-skinny>=3", "sqlalchemy>=2", "alembic>=1"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "hypothesis>=6", "ruff>=0.11"]

[project.scripts]
gamefield-study = "gamefield_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/gamefield_research"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "gamefield_research/_bundle/fixtures"
"deploy" = "gamefield_research/_bundle/deploy"
"python/gamefield_research" = "gamefield_research/_bundle/python/gamefield_research"
"pyproject.toml" = "gamefield_research/_bundle/pyproject.toml"
"uv.lock" = "gamefield_research/_bundle/uv.lock"

[tool.pytest.ini_options]
testpaths = ["python_tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["python/**/*.py", "python_tests/**/*.py", "tools/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
